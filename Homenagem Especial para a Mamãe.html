        body{

        h1 {
            color: #d147a3;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 20px;
        }

        /* Container do "GIF" de fotos */
        .galeria-gif {
            width: 350px;
            height: 450px;
            position: relative;
            overflow: hidden;
            border-radius: 50%; /* Deixa em formato de círculo */
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border: 5px solid white;
        }

        /* Configuração de cada foto */
        .galeria-gif img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            animation: passarFotos 12s infinite;
        }

        /* Tempo de cada foto (4 segundos para cada) */
        .galeria-gif img:nth-child(1) { animation-delay: 0s; }
        .galeria-gif img:nth-child(2) { animation-delay: 4s; }
        .galeria-gif img:nth-child(3) { animation-delay: 8s; }

        @keyframes passarFotos {
            0% { opacity: 0; }
            5% { opacity: 1; } /* Fade-in */
            30% { opacity: 1; } /* Visível */
            35% { opacity: 0; } /* Fade-out */
            100% { opacity: 0; }
        }

        /* Player de Música */
        .player-musica {
            margin-top: 30px;
            background: white;
            padding: 8px;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
